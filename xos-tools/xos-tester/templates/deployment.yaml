apiVersion: apps/v1beta2
kind: Deployment
metadata:
  name: xos-tester
  labels:
    app: xos-tester
    chart: xos-tester
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xos-tester
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: xos-tester
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: xos-tester
          image: {{ .Values.global.registry }}{{ .Values.image.repository }}:{{ tpl .Values.image.tag . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["--variable num_olts:4 --variable num_onus:4 --variable num_pon_ports:4  --variable cord_kafka:10.152.183.90 XosScaleValidations/xos-scale-att-workflow.robot"]
