apiVersion: batch/v1
kind: Job
metadata:
  name: xos-tester
  labels:
    app: xos-tester
    chart: xos-tester
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  template:
    metadata:
      labels:
        app: xos-tester
        release: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: xos-tester
          image: {{ .Values.global.registry }}{{ .Values.image.repository }}:{{ tpl .Values.image.tag . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [
            "robot",
            "--variable", "num_olts:{{ .Values.test_params.num_olts }}",
            "--variable", "num_onus:{{ .Values.test_params.num_onus }}",
            "--variable", "num_pon_ports:{{ .Values.test_params.num_pon_ports }}",
            "--variable", "cord_kafka:cord-platform-kafka",
            "XosScaleValidations/xos-scale-att-workflow.robot"
          ]
