images:
  tags:
    dep_check: quay.io/stackanetes/kubernetes-entrypoint:v0.3.1
    enb: lte-softmodem:v1.0.0
    ue: lte-uesoftmodem:v1.0.0
  pullPolicy: IfNotPresent
conf:
  # 1 PLMN is supported for now
  plmn:
    name: "COMAC Test Network"
    short_name: "COMAC"
    mcc: "001"
    mnc: "01"
    mnc_length: 2
  enb:
    name: enb
    # Provide the IP address of MME
    # Leave the address blank unless using external MME
    # For the other networks, leave the interface to eth0
    # unless don't add additional networks to the enb pod
    mme:
      address:
    networks:
      s1_mme:
        interface: eth0
      s1u:
        interface: s1u-net
        port: 2152
  ue:
    name: ue
    # 1 UE is supported for now
    sim:
      msin: "4567891201"
      api_key: "465b5ce8b199b49faa5f0a2ee238a6bc"
      opc: "d4416644f6154936193433dd20a0ace0"
      msisdn: "1122334456"
