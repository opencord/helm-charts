{{- $releaseName := .Release.Name }}
{{- $namespace := .Release.Namespace }}
{{- $name := .Values.conf.ue.name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-init-lte-if
  labels:
    app: {{ $name }}
spec:
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      serviceAccountName: {{ $releaseName }}-{{ $name }}
      restartPolicy: OnFailure
      containers:
        - name: ue-init-lte-if
          image: {{ .Values.images.tags.ue | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            privileged: true
            runAsUser: 0
          command:
            - /opt/oaisim/ue/scripts/ue-init-lte-if.sh
          volumeMounts:
            - name: script
              mountPath: /opt/oaisim/ue/scripts/ue-init-lte-if.sh
              subPath: ue-init-lte-if.sh
            - name: host-rootfs
              mountPath: /mnt/host-rootfs
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
            defaultMode: 493
        - name: host-rootfs
          hostPath:
            path: /
