- name: Install charts
  command: helm upgrade --install {{ item.name }} {{ item.path }}
  args:
    chdir: "{{ ansible_env.HOME }}/cord/build/helm-charts"
  with_items:
  - { name: xos-core, path: ./xos-core }
  - { name: xos-openstack, path: ./xos-services/openstack }
  - { name: xos-onos, path: ./xos-services/onos-service }
  - { name: xos-vtn, path: ./xos-services/vtn-service }
  - { name: onos-cord, path: ./onos }
  tags:
  - skip_ansible_lint

- name: Wait for ONOS to come up
  shell: kubectl get pod | grep onos-cord | grep Running
  register: result
  until: result is success
  retries: 30
  delay: 10
  tags:
  - skip_ansible_lint

- name: Add head node private key to ONOS (HACK - should be a secret or something)
  shell: |
    HEAD_PRIVKEY={{ ansible_env.HOME}}/cord/build/scenarios/preppedkube/.vagrant/machines/head1/libvirt/private_key
    ONOS_CORD_POD=$( kubectl get pod | grep onos-cord | awk '{print $1}' )
    kubectl cp $HEAD_PRIVKEY $ONOS_CORD_POD:/root/node_key
  tags:
  - skip_ansible_lint

- name: Download trusty-server-multi-nic image into OpenStack service VM (HACK - should be a volume)
  SHELL:
    XOS_OPENSTACK_POD=$( kubectl get pod | grep xos-openstack | awk '{print $1}' )
    kubectl exec $XOS_OPENSTACK_POD -- curl -L --create-dirs -o /opt/xos/images/trusty-server-multi-nic.qcow2 https://github.com/opencord/platform-install/releases/download/vms/trusty-server-cloudimg-amd64-disk1.img.20170201

- name: Wait for XOS TOSCA engine to be ready after service onboarding
  uri:
    url: "{{ xos_tosca_url }}"
    method: GET
    status_code: 200
    return_content: yes
  register: xosready_tosca
  until: xosready_tosca.status == 200
  retries: 40
  delay: 15

- name: Run TOSCA recipes (specific to preppedkube scenario)
  uri:
    url: "{{ xos_tosca_url }}/run"
    method: POST
    headers:
      xos-username: "{{ xos_admin_user }}"
      xos-password: "{{ xos_admin_pass }}"
    body: "{{ lookup('file',  ansible_env.HOME + '/cord/build/helm-charts/examples/' + item ) }}"
    status_code: 200
  with_items:
    - openstack-tosca.yaml
    - openstack-compute-tosca.yaml
    - vtn-service-tosca.yaml
  register: result
  until: result is success
  retries: 5
  delay: 5
