# Values file for SEBA log aggregation infra

# Kibana config
# ref: https://github.com/helm/charts/tree/master/stable/kibana
kibana:
  sevice:
    type: "NodePort"
    service: 5601
  env:
    ELASTICSEARCH_URL: http://elasticsearch.default.svc.cluster.local:9200

# Elasticstack config
# ref: https://github.com/helm/charts/tree/master/incubator/elasticsearch
elasticsearch:
  master:
    persistence:
      storageClass: "local-ssd"
      size: "2Gi"
  data:
    persistence:
      storageClass: "local-hdd"
      size: "5Gi"

