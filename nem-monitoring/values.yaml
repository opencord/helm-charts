nem_voltha_kpi_exporter_image: "matteoscandolo/prometheus-go-exporter:latest"
nem_voltha_kpi_exporter_nodePort: 30080
imagePullPolicy: "Always"
args:
  voltha_kpi_broker: voltha-kafka.default.svc.cluster.local
  voltha_kpi_topic: voltha.kpis

prometheus:
  rbac:
    create: false
  alertmanager:
    persistentVolume:
      enabled: false
  server:
    persistentVolume:
      enabled: false
    service:
      type: NodePort
      nodePort: 31301
  serverFiles:
    alerts: {}
    rules: {}

    prometheus.yml:
      rule_files:
        - /etc/config/rules
        - /etc/config/alerts

      scrape_configs:
        - job_name: myjob
          metrics_path: /metrics
          scrape_interval: 15s
          static_configs:
            - targets:
              - voltha-kpi-exporter:8080

grafana:
  adminUser: admin
  adminPassword: strongpassword
  service:
    type: NodePort
    nodePort: 31300
  rbac:
    create: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://nem-monitoring-prometheus-server.default.svc.cluster.local
          access: proxy
          isDefault: true