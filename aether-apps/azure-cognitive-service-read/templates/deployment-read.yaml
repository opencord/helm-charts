---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognitive-service-read
  labels:
{{ tuple "cognitive-service-read" . | include "cognitive-service-read.metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple "cognitive-service-read" . | include "cognitive-service-read.metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple "cognitive-service-read" . | include "cognitive-service-read.metadata_labels" | indent 8 }}
    spec:
      imagePullSecrets:
      - name: cognitive-service-read-regcred
      containers:
      - name: cognitive-service-read
        image: {{ .Values.images.tags.read }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        ports:
        - containerPort: 5000
        env:
        - name: EULA
          value: {{ .Values.config.read.eula }}
        - name: billing
          value: {{ .Values.config.read.billing }}
        - name: apikey
          value: {{ .Values.config.read.apikey }}
