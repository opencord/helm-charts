images:
  tags:
    cameraIngestion: registry.central.aetherproject.net/google/phylo-camera-ingestion-client:latest
    videoAnalyticsServer: registry.central.aetherproject.net/google/phylo_video-analytics-server:0.1.1
    wowza: registry.central.aetherproject.net/google/wowza:latest
    phyloRabbitmq: registry.central.aetherproject.net/google/phylo-rabbitmq:latest
    phyloRabbitmqPubsub: registry.central.aetherproject.net/google/phylo-rmq-pubsub:latest
    jupyter: registry.central.aetherproject.net/google/jupyter:latest
    depCheck: registry.central.aetherproject.net/kubernetes-entrypoint:v0.3.1
  pullPolicy: "IfNotPresent"

nodeSelectors:
  enabled: true
  phylo:
    label: aether-apps
    value: enabled
  wowza:
    label: aether-apps
    value: enabled
  jupyter:
    label: aether-apps
    value: enabled

resources:
  enabled: false
  phyloRabbitmq:
    requests:
      cpu: 2
      memory: 2048Mi
    limits:
      cpu: 2
      memory: 2048Mi
  phyloRabbitmqPubsub:
    requests:
      cpu: 2
      memory: 2048Mi
    limits:
      cpu: 2
      memory: 2048Mi
  videoAnalyticsServer:
    requests:
      cpu: 2
      memory: 2048Mi
    limits:
      cpu: 2
      memory: 2048Mi
  cameraIngestion:
    requests:
      cpu: 2
      memory: 2048Mi
    limits:
      cpu: 2
      memory: 2048Mi
  wowza:
    requests:
      cpu: 2
      memory: 2048Mi
    limits:
      cpu: 2
      memory: 2048Mi
  jupyter:
    requests:
      cpu: 2
      memory: 2048Mi
    limits:
      cpu: 2
      memory: 2048Mi

config:
  phylo:
    sources:
      - key: mystream
        uri: rtmp://192.168.250.31:31935/live/myStream
  wowza:
    replica: 1
