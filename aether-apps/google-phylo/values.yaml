images:
  tags:
    cameraIngestion: registry.aether.opennetworking.org/google/phylo_camera-ingestion-client:0.1.1
    videoAnalyticsServer: registry.aether.opennetworking.org/google/phylo_video-analytics-server:0.1.1
    wowza: registry.aether.opennetworking.org/google/wowza:0.1.0
    phyloRabbitmq: registry.aether.opennetworking.org/google/phylo_rabbitmq_pubsub:0.1.0
    depCheck: registry.aether.opennetworking.org/kubernetes-entrypoint:v0.3.1
  pullPolicy: "IfNotPresent"

nodeSelectors:
  enabled: false
  phyloRabbitmq:
    label: aether-apps
    value: enabled
  videoAnalyticsServer:
    label: aether-apps
    value: enabled
  cameraIngestion:
    label: aether-apps
    value: enabled
  wowza:
    label: aether-apps
    value: enabled

resources:
  enabled: false
  phyloRabbitmq:
    requests:
      cpu: 2
      memory: 2048Mi
    limits:
      cpu: 2
      memory: 2048Mi
  videoAnalyticsServer:
    requests:
      cpu: 2
      memory: 2048Mi
    limits:
      cpu: 2
      memory: 2048Mi
  cameraIngestion:
    requests:
      cpu: 2
      memory: 2048Mi
    limits:
      cpu: 2
      memory: 2048Mi
  wowza:
    requests:
      cpu: 2
      memory: 2048Mi
    limits:
      cpu: 2
      memory: 2048Mi

config:
  videoAnalyticsServer:
    rabbitmq:
      host: phylo-rabbitmq
      port: 5672
  cameraIngestion:
    #sourceUri: rtsp://root:pass@10.250.0.254/axis-media/media.amp
    sourceUri: rtmp://104.154.229.70:1935/live/myStream
    targetAddress: video-analytics-server:50051
    resize:
      height: 0
      width: 0
  wowza:
    replica: 1
    hostNetwork:
      enabled: true
