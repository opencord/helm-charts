---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  labels:
{{ tuple "jupyter" . | include "phylo.metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple "jupyter" . | include "phylo.metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple "jupyter" . | include "phylo.metadata_labels" | indent 8 }}
    spec:
    {{- if .Values.nodeSelectors.enabled }}
      nodeSelector:
        {{ .Values.nodeSelectors.jupyter.label }}: {{ .Values.nodeSelectors.jupyter.value }}
    {{- end }}
      containers:
      - name: jupyter
        image: {{ .Values.images.tags.jupyter }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
      {{- if .Values.resources.enabled }}
        resources:
{{ toYaml .Values.resources.jupyter | indent 10 }}
      {{- end }}
        env:
          - name: NB_UID
            value: "1000"
          - name: NB_GID
            value: "100"
          - name: GRANT_SUDO
            value: "yes"
        volumeMounts:
        - name: jupyter
          mountPath: /home/jovyan/work
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 100
      volumes:
      - name: jupyter
        emptyDir: {}
