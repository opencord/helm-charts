---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phylo-rabbitmq
  labels:
{{ tuple "phylo-rabbitmq" . | include "phylo.metadata_labels" | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ tuple "phylo-rabbitmq" . | include "phylo.metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple "phylo-rabbitmq" . | include "phylo.metadata_labels" | indent 8 }}
    spec:
    {{- if .Values.nodeSelectors.enabled }}
      nodeSelector:
        {{ .Values.nodeSelectors.phyloRabbitmq.label }}: {{ .Values.nodeSelectors.phyloRabbitmq.value }}
    {{- end }}
      containers:
      - name: phylo-rabbitmq
        image: {{ .Values.images.tags.phyloRabbitmq }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
      {{- if .Values.resources.enabled }}
        resources:
{{ toYaml .Values.resources.phyloRabbitmq | indent 10 }}
      {{- end }}
