#
# The dashd deployment
#
apiVersion: apps/v1beta1
kind: Deployment
metadata:
  name: dashd
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: dashd
    spec:
      containers:
      - name: dashd
        image: {{ .Values.pull_docker_registry }}{{ .Values.images.dashd.repository }}:{{ .Values.images.dashd.tag }}
        imagePullPolicy: {{ .Values.image_pull_policy }}
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        args:
{{ toYaml .Values.stats.dashd_args | indent 8 }} 
---
#
# The shovel deployment
#
apiVersion: apps/v1beta1
kind: Deployment
metadata:
  name: shovel
  namespace: voltha
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: shovel
    spec:
      containers:
      - name: shovel
        image: {{ .Values.pull_docker_registry }}{{ .Values.images.shovel.repository }}:{{ .Values.images.shovel.tag }}
        imagePullPolicy: {{ .Values.image_pull_policy }}
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        args:
{{ toYaml .Values.stats.shovel_args | indent 8 }} 
