---
apiVersion: v1
kind: ConfigMap
metadata:
  name: live-probe-scripts
  labels:
    app: "{{ .Chart.Name }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Chart.Version }}"
data:
  check-onos-app-status: |
    #!/bin/bash
    set -e
    live_probe () {
        apps=$ONOS_CORD_APPS
        IFS=',' read -ra app_array <<< "$apps"
        for i in "${app_array[@]}"
            do
            file="/root/onos/apps/$i/active"
            if [ -f "$file" ]
            then
                echo "app $i found"
            else
                echo "failed reason : app $i not found"
                return 1
            fi
        done
        return 0
    }
    live_probe
