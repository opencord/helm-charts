---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ready-probe-scripts
  labels:
    app: "{{ .Chart.Name }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Chart.Version }}"
data:
  check-onos-status: |
    #!/bin/bash
    set -e
    host=$(hostname --ip-address)
    config=$(curl -s http://$host:8181/onos/v1/cluster/$host --user onos:rocks)
    echo $config
    printf '%q' $config | grep -q "READY"
