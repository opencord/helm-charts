replicaCount: 1

image:
  repository: onosproject/onos
  tag: 1.12.0
  pullPolicy: IfNotPresent

services:
  ovsdb:
    port: 6640
  openflow:
    port: 6653
  ssh:
    port: 8101
  ui:
    port: 8181
  cluster:
    port: 9876

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
