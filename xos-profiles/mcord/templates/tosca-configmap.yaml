apiVersion: v1
kind: ConfigMap
metadata:
  name: mcord-tosca
data:
  010-fixtures.yaml: |
{{ include "mcord.fixtureTosca" . | indent 4 }}
  020-openstack-controller.yaml: |
{{ include "openstack.controllerTosca" .Values | indent 4 }}
  030-openstack-flavors.yaml: |
{{ include "openstack.flavorTosca" .Values.openstack | indent 4 }}
  040-vtn-service.yaml: |
{{ include "vtn-service.serviceTosca" (index .Values "vtn-service") | indent 4 }}
  050-openstack-compute.yaml: |
{{ toYaml .Values.toscaRecipes.openstackCompute | indent 4 }}
  060-openstack-networks.yaml: |
{{ include "openstack.networkTosca" .Values | indent 4 }}
  070-onos-service-vtn-app.yaml: |
{{ include "onos-service.vtnAppTosca" (index .Values "onos-service") | indent 4 }}
  080-vspgwu-service.yaml: |
{{ include "vspgwu.serviceTosca" .Values.vspgwu | indent 4 }}
  090-vspgwc-service.yaml: |
{{ include "vspgwc.serviceTosca" .Values.vspgwc | indent 4 }}
  100-vmme-service.yaml: |
{{ include "vmme.serviceTosca" .Values.vmme | indent 4 }}
  110-vhss-service.yaml: |
{{ include "vhss.serviceTosca" .Values.vhss | indent 4 }}
  120-hssdb-service.yaml: |
{{ include "hssdb.serviceTosca" .Values.hssdb | indent 4 }}
  130-internetemulator-service.yaml: |
{{ include "internetemulator.serviceTosca" .Values.internetemulator | indent 4 }}
  140-progran-service.yaml: |
{{ include "progran.serviceTosca" .Values.progran | indent 4 }}
  150-sdncontroller-service.yaml: |
{{ include "sdncontroller.serviceTosca" .Values.sdncontroller | indent 4 }}
  160-mcord-subscriber-service.yaml: |
{{ include "mcord-subscriber.serviceTosca" (index .Values "mcord-subscriber") | indent 4 }}
  170-epc-service.yaml: |
{{ include "epc-service.serviceTosca" (index .Values "epc-service") | indent 4 }}
  180-fabric-service.yaml: |
{{ include "fabric.serviceTosca" .Values.fabric | indent 4 }}
  190-onos-service-fabric.yaml: |
{{ include "onos-service.fabricAppTosca" (index .Values "onos-service") | indent 4 }}
  300-service-graph.yaml: |
{{ include "mcord.serviceGraphTosca" . | indent 4 }}
