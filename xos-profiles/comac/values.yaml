# Default values for the COMAC profile.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

images:
  tosca_loader:
    repository: 'xosproject/tosca-loader'
    tag: '{{ .Chart.AppVersion }}'
    pullPolicy: 'Always'
  xos_api_tester:
    repository: 'xosproject/xos-api-tester'
    tag: 'master'
    pullPolicy: 'Always'

global:
  registry: ""

xosAdminUser: "admin@opencord.org"
xosAdminPassword: "letmein"

# ONOS applications
sadisAppUrl: "https://oss.sonatype.org/service/local/artifact/maven/redirect?r=snapshots&g=org.opencord&a=sadis-app&v=4.0.0-SNAPSHOT&e=oar"
sadisAppVersion: "4.0.0-SNAPSHOT"

oltAppUrl: "https://oss.sonatype.org/service/local/artifact/maven/redirect?r=snapshots&g=org.opencord&a=olt-app&v=4.0.0-SNAPSHOT&e=oar"
oltAppVersion: "4.0.0-SNAPSHOT"

kafkaAppUrl: "https://oss.sonatype.org/service/local/artifact/maven/redirect?r=snapshots&g=org.opencord&a=kafka&v=2.2.0-SNAPSHOT&e=oar"
kafkaAppVersion: "2.2.0-SNAPSHOT"

onosRestService: "onos-ui.default.svc.cluster.local"
kafkaService: "cord-kafka.default.svc.cluster.local:9092"

wired_service:
  enabled: false

# whether to install or not this shared services
vrouter:
  enabled: true
fabric:
  enabled: true
onos-service:
  enabled: true
