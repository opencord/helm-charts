# Values file for deploying SEBA with Ponsim, Stratum and SD-BNG
# Use this file to deploy the service versions specified in the Helm charts.

images:
  # Mininet image
  mininet:
    repository: 'opencord/mn-stratum-siab'
    tag: 'master'
    pullPolicy: Always
  onos:
    repository: 'onosproject/onos'
    tag: '2.2-latest'
    pullPolicy: Always
  rg:
#    TODO: Modify when this docker image is published
    repository: 'dmoro92/voltha-rg'
    tag: 'dev'
    pullPolicy: Always
  kpi_exporter:
    # TODO: Modify when this docker image is published
    repository: 'dmoro92/kafka-topic-exporter'
    tag: '1.2.6-dev'
    pullPolicy: Always

# ONOS activate debug
onos_env:
  - name: JAVA_DEBUG_PORT
    value: "0.0.0.0:5005"

# voltha
etcd-cluster:
  clusterSize: 1

# Set topics for KPI-exporter
kpi_exporter:
  topics:
    - voltha.kpis
    - onos.aaa.stats.kpis
    - onos.kpis
    - bng.stats
dashboards:
  bng: true

# Select DT-Workflow
workflow: dt-workflow

dt-workflow-driver:
  image:
#    TODO: modify when DT workflow synchronizer is published
    repository: "dmoro92/dt-workflow-driver-synchronizer"
    tag: "1.0.0-dev"
  # this is mandatory, it's needed to correctly configure the kafka endpoint
  kafkaService: cord-kafka

rcord:
  image:
    repository: 'matteoscandolo/rcord-synchronizer'
    tag: 'candidate'

# in mininet chart
# FIXME: make multicast working
enableMulticast: false
topoScript: '/toposcripts/topo_mn_sdbng.py'
stratumEnabled: true

# in ponsim-pod chart
bandwidthProfiles: true
legacyPonsim: false

# fabric
fabric:
  enabled: true
  stratum:
    # BMv2 drivers will activate also stratum drivers
    driverAppId: 'org.onosproject.drivers.bmv2'
    # Enable stratum
    enabled: true
    # Use BMv2 pipeconf (already in ONOS)
    pipeconfProvided: false
    pipeconfAppId: 'org.onosproject.pipelines.fabric'
bng:
  external:
    enabled: false
  embedded:
    enabled: true
    # ONOS app to provide the BNG control plane
    bngAppId: "org.opencord.bng"
    bngAppUrl: "https://oss.sonatype.org/service/local/artifact/maven/redirect?r=snapshots&g=org.opencord&a=bng-app&v=1.0.0-SNAPSHOT&e=oar"
    bngAppVersion: "1.0.0.SNAPSHOT"


# ONOS applications
sadisAppUrl: "https://oss.sonatype.org/content/groups/public/org/opencord/sadis-app/4.0.1/sadis-app-4.0.1.oar"
sadisAppVersion: "4.0.1"

oltAppUrl: "https://oss.sonatype.org/content/groups/public/org/opencord/olt-app/4.0.0/olt-app-4.0.0.oar"
oltAppVersion: "4.0.0"

kafkaAppUrl: "https://oss.sonatype.org/service/local/artifact/maven/redirect?r=snapshots&g=org.opencord&a=kafka&v=2.0.1-SNAPSHOT&e=oar"
kafkaAppVersion: "2.0.1.SNAPSHOT"

aaaAppUrl: "https://oss.sonatype.org/content/groups/public/org/opencord/aaa-app/2.0.0/aaa-app-2.0.0.oar"
aaaAppVersion: "2.0.0"
