# Values file for deploying SEBA with Ponsim and Stratum
# Use this file to deploy the service versions specified in the Helm charts.

images:
  # Mininet image
  mininet:
    repository: 'opencord/mn-stratum-siab'
    tag: 'master'
    pullPolicy: Always
#    TODO: Modify when ONOS 2.2.1 is released
  onos:
    repository: 'dmoro92/onos'
    tag: '2.2-dev'
    pullPolicy: Always
#    TODO: Modify when this docker image is published
  rg:
    repository: 'dmoro92/voltha-rg'
    tag: 'dev'
    pullPolicy: Always

# ONOS activate debug
onos_env:
  - name: JAVA_DEBUG_PORT
    value: "0.0.0.0:5005"

# voltha
etcd-cluster:
  clusterSize: 1

# Set topics for KPI-exporter, adding the bng.stats
kpi_exporter:
# Select DT-Workflow
workflow: dt-workflow

dt-workflow-driver:
  image:
#    TODO: modify when DT workflow synchronizer is published
    repository: "ccasconeonf/dt-workflow-driver-synchronizer"
    tag: "1.0.0-dev"
  # this is mandatory, it's needed to correctly configure the kafka endpoint
  kafkaService: cord-kafka

rcord:
  image:
    repository: 'matteoscandolo/rcord-synchronizer'
    tag: 'candidate'


# in mininet chart
# FIXME: make multicast working
enableMulticast: false
topoScript: '/toposcripts/topo_mn_stratum_sdbng.py'
stratumEnabled: true

# in ponsim-pod chart
bandwidthProfiles: true
legacyPonsim: false

# fabric
fabric:
  enabled: true
  stratum:
    # BMv2 drivers will activate also stratum drivers
    driverAppId: 'org.onosproject.drivers.bmv2'
    # Enable stratum
    enabled: true
    # Use BMv2 pipeconf (already in ONOS)
    pipeconfProvided: false
    pipeconfAppId: 'org.onosproject.pipelines.fabric'
bng:
  external:
    enabled: false
  embedded:
    enabled: true
    # ONOS app to provide the BNG control plane
    # FIXME: add the correct BNG app
    bngcAppId: "org.opencord.bng"
    bngcAppUrl: "https://oss.sonatype.org/content/groups/public/org/opencord/bngc/1.0.0/bngc-1.0.0.oar"
    bngcAppUrl: "https://oss.sonatype.org/service/local/artifact/maven/redirect?r=snapshots&g=org.opencord&a=bng-app&v=1.0-SNAPSHOT&e=oar"
    bngcAppVersion: "1.0.SNAPSHOT"


# ONOS applications
# TODO: use 4.0.1.SNAPSHOT
sadisAppUrl: "https://oss.sonatype.org/service/local/artifact/maven/redirect?r=snapshots&g=org.opencord&a=sadis-app&v=4.0.0-SNAPSHOT&e=oar"
sadisAppVersion: "4.0.0.SNAPSHOT"

oltAppUrl: "https://oss.sonatype.org/service/local/artifact/maven/redirect?r=snapshots&g=org.opencord&a=olt-app&v=4.0.0-SNAPSHOT&e=oar"
oltAppVersion: "4.0.0.SNAPSHOT"

kafkaAppUrl: "https://oss.sonatype.org/service/local/artifact/maven/redirect?r=snapshots&g=org.opencord&a=kafka&v=2.0.0-SNAPSHOT&e=oar"
kafkaAppVersion: "2.0.0.SNAPSHOT"

aaaAppUrl: "https://oss.sonatype.org/service/local/artifact/maven/redirect?r=snapshots&g=org.opencord&a=aaa-app&v=2.0.0-SNAPSHOT&e=oar"
aaaAppVersion: "2.0.0.SNAPSHOT"
