# Values file for deploying SEBA with Ponsim and Stratum
# Use this file to deploy the service versions specified in the Helm charts.

images:
  # Mininet image
  mininet:
    # The `opennetworking/mn-stratum` image misses `bridge-utils` and `dnsmasq`
    # package, which causes an error when `/toposcripts/topo_mn_stratum.py` tries
    # to build LinuxBridge with `brctl` command.
    repository: 'steven30801/mn-stratum'
    tag: 'latest'
    pullPolicy: Always

# voltha
etcd-cluster:
  clusterSize: 1

# in workflow/att-workflow service chart
att-workflow-driver:
  # this is mandatory, it's needed to correctly configure the kafka endpoint
  kafkaService: cord-kafka

# in workflow/tt-workflow service chart
tt-workflow-driver:
  image:
    repository: andybavier/test-image-synchronizer
    tag: tt-workflow-driver

  # this is mandatory, it's needed to correctly configure the kafka endpoint
  kafkaService: cord-kafka

# in mininet chart
# FIXME: check if multicast is working
enableMulticast: false
topoScript: '/toposcripts/topo_mn_stratum.py'
stratumEnabled: true

# in ponsim-pod chart
bandwidthProfiles: true
legacyPonsim: false

# fabric
fabric:
  enabled: true
  # TODO: Remove when the patch will be merged
  image:
    repository: 'matteoscandolo/fabric-synchronizer'
    tag: '2.2.3-dev'
  stratum:
    # Enable stratum
    enabled: true
    # Use BMv2 pipeconf (already in ONOS)
    pipeconfProvided: false