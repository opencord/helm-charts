apiVersion: apps/v1beta2
kind: Deployment
metadata:
  name: {{ template "abstract-olt.fullname" . }}
  labels:
    app: {{ template "abstract-olt.name" . }}
    chart: {{ template "abstract-olt.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "abstract-olt.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "abstract-olt.name" . }}
        release: {{ .Release.Name }}
    {{- with .Values.annotations }}
      annotations:
{{ toYaml . | indent 8 }}
    {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.abstractOlt.image.repository }}/{{ .Values.abstractOlt.image.image}}:{{ tpl .Values.abstractOlt.image.tag . }}"
          imagePullPolicy: {{ .Values.abstractOlt.image.pullPolicy }}
          ports:
             - name: grpc
               containerPort: 7777
               protocol: TCP
             - name: rest
               containerPort: 7778
               protocol: TCP
          command: ["/app/AbstractOLT"]
          args: [ "-d={{ .Values.abstractOlt.service.debug }}",
                  "-log_file=/dev/stdout",
                  "-listenAddress={{ .Values.abstractOlt.service.listenAddress }}",
                  "-dummy={{ .Values.abstractOlt.service.dummy }}",
                  "-useMongo={{ .Values.abstractOlt.service.useMongo }}",
                  "-mongodb={{ .Values.abstractOlt.service.mongodb }}"]

          resources:
{{ toYaml .Values.resources | indent 12 }}
    {{- with .Values.abstractOlt.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.abstractOlt.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.abstractOlt.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
