images:
  tags:
    tomcatFs: docker.io/omecproject/tomcat-fs:1.0.0
  pullPolicy: IfNotPresent

nodeSelectors:
  enabled: false
  tomcatFs:
    label: tomcat-fs
    value: enabled

resources:
  enabled: true
  tomcatFs:
    requests:
      cpu: 3
      memory: 1Gi
    limits:
      cpu: 3
      memory: 1Gi

config:
  sriov:
    enabled: true # If you want to use Host Network, please unset this flag.
    netDevice:
      pfNames:
        - eno2
      drivers:
        - ixgbevf
        - i40evf
  tomcatFs:
    ports:
      http: 8080
      nodePorts:
        enabled: true
        http: 31880
    sgi:
      device: sgi-net-tomcat
      ip: 13.1.1.252/24
      mtu: 1200


networks:
  cniPlugin: sriov # which means netdevice
  ipam: static
  sgi:
    subnet: 13.1.1.0/24
    mask: 255.255.255.0
    gateway: 13.1.1.254