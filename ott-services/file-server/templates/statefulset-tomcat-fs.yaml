{{ tuple "tomcat-fs" . | include "file-server.service_account" }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tomcat-fs
  labels:
{{ tuple "tomcat-fs" . | include "file-server.metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.config.tomcatFs.replicas }}
  selector:
    matchLabels:
{{ tuple "tomcat-fs" . | include "file-server.metadata_labels" | indent 6 }}
  serviceName: "tomcat-fs"
  template:
    metadata:
      labels:
{{ tuple "tomcat-fs" . | include "file-server.metadata_labels" | indent 8 }}
{{ if .Values.config.sriov.enabled }}
      annotations:
        k8s.v1.cni.cncf.io/networks: '[
          {
            "name": {{ .Values.config.tomcatFs.sgi.device | quote }},
            "interface": {{ .Values.config.tomcatFs.sgi.device | quote }},
            "ips": {{ .Values.config.tomcatFs.sgi.ip | quote }}
          }
        ]'
{{ end }}
    spec:
    {{- if .Values.nodeSelectors.enabled }}
      nodeSelector:
        {{ .Values.nodeSelectors.tomcatFs.label }}: {{ .Values.nodeSelectors.tomcatFs.value }}
    {{- end }}
      hostNetwork: {{ not .Values.config.sriov.enabled }}
      serviceAccountName: tomcat-fs
      containers:
      - name: tomcat-fs
        image: {{ .Values.images.tags.tomcatFs }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        command: [ "bash",  "-xc"]
        args:
        - network-config.sh; run-tomcat.sh; while true; do sleep 3600; done
        securityContext:
          privileged: true
        volumeMounts:
          - name: network-config
            mountPath: /usr/local/tomcat
        resources:
          requests:
          {{- if .Values.resources.enabled }}
{{ toYaml .Values.resources.tomcatFs.requests | indent 12 }}
          {{- end }}
          {{- if .Values.config.sriov.enabled }}
            intel.com/sriov_netdevice: 2
          {{- end }}
          limits:
          {{- if .Values.resources.enabled }}
{{ toYaml .Values.resources.tomcatFs.limits | indent 12 }}
          {{- end }}
          {{- if .Values.config.sriov.enabled }}
            intel.com/sriov_netdevice: 2
          {{- end }}
      volumes:
      - name: network-config
        configMap:
          name: network-config
          defaultMode: 493
