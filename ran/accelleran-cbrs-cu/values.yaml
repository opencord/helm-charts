images:
  tags:
    initCU: docker.io/omecproject/pod-init:1.0.0
    nats: 10.90.0.150:5000/aether/accelleran-cu-nats:v1.0.0
    redis: 10.90.0.150:5000/aether/accelleran-cu-redis:v1.0.0
    vranL3: 10.90.0.150:5000/aether/accelleran-cu-l3-tdd:v1.0.0
    ric: 10.90.0.150:5000/aether/accelleran-cu-ric:v1.0.0
    ricWeb: 10.90.0.150:5000/aether/accelleran-cu-ricweb:v1.0.0
  pullPolicy: IfNotPresent

nodeSelectors:
  enabled: false
  accelleranCBRSCU:
    label: accelleran-cbrs-cu
    value: enabled

resources:
  enabled: true
  accelleranCBRSCU:
    requests:
      cpu: 3
      memory: 1Gi
    limits:
      cpu: 3
      memory: 1Gi

config:
  vranL3:
    zlogConf:
      bufferMin: 64K
      bufferMax: 64K
    instanceId: enb_key
    ports:
      s1ap:
        port: 36412
        nodePort: 31412
        protocol: SCTP
  nats:
    ports:
      natsPort:
        port: 4222
        nodePort: 31000
        protocol: TCP
      clusterPort:
        port: 6222
        nodePort: 31001
        protocol: TCP
      consolePort:
        port: 8222
        nodePort: 31002
        protocol: TCP
  redis:
    ports:
      redisPort:
        port: 6379
        nodePort: 32000
        protocol: TCP
  ric:
    zlogConf:
      bufferMin: 64K
      bufferMax: 64K
    instanceId: ric_key
  ricWeb:
    ports:
      ricWebPort:
        port: 8080
        nodePort: 30000
        protocol: TCP
