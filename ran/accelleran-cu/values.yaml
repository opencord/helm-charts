images:
  tags:
    initCU: ngick8stesting/c3po-mmeinit
    nats: node1:30500/accelleran/vran-nats:20190121
    redis: node1:30500/accelleran/vran-redis:20190121
    vranL3: node1:30500/accelleran/vran-l3-fdd:onf-dns
  pullPolicy: IfNotPresent

nodeSelectors:
  enabled: false
  accelleranCU:
    label: accelleran-cu
    value: enabled

resources:
  enabled: true
  accelleranCU:
    requests:
      cpu: 3
      memory: 1Gi
    limits:
      cpu: 3
      memory: 1Gi

config:
  epc:
    plmnId: 371211
  mme:
    nodeIpAddr: 10.90.0.132
    s1apPort: 36412
  accelleranRUDU:
    socketInterface: eth0
  accelleranCU:
    #location: remote
    nodeIp: 10.90.0.131
    replicas: 1
    vranL3:
      ports:
        s1ap: 36412
        nats: 4222
        redis: 6379
        nodePorts:
          s1ap: 31412
          nats: 4222
          redis: 6379
      instId: "enb_key"
      progran:
        enabled: false
        progranCtrlIpAddr: 10.90.0.132
        port: 30410
    nats:
      serviceName: "nats-cluster"

