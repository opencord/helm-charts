images:
  tags:
    initCU: docker.io/omecproject/pod-init:1.0.0
    redisClient: docker.io/redis:5.0.6-alpine3.10
    vranL3: 10.90.0.150:5000/aether/accelleran-cu-l3-tdd:v1.0.0
  pullPolicy: IfNotPresent

nodeSelectors:
  enabled: false
  accelleranCBRSCU:
    label: accelleran-cbrs-cu
    value: enabled

resources:
  enabled: true
  accelleranCBRSCU:
    requests:
      cpu: 3
      memory: 1Gi
    limits:
      cpu: 3
      memory: 1Gi

config:
  vranL3:
    zlogConf:
      bufferMin: 64K
      bufferMax: 64K
    instanceId: ONFCell202
    ports:
      s1ap:
        port: 36412
        nodePort: 31412
        protocol: SCTP
  redis:
    ports:
      redisPort:
        port: 6379
  mme:
    ip: 10.90.0.151
    s1apPort: 36412
    