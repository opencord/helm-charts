---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: accelleran-cbrs-ricweb
  labels:
{{ tuple "accelleran-cbrs-ricweb" . | include "accelleran-cbrs-framework.metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple "accelleran-cbrs-ricweb" . | include "accelleran-cbrs-framework.metadata_labels" | indent 6 }}
  serviceName: accelleran-cbrs-ricweb
  template:
    metadata:
      labels:
{{ tuple "accelleran-cbrs-ricweb" . | include "accelleran-cbrs-framework.metadata_labels" | indent 8 }}
    spec:
    {{- if .Values.nodeSelectors.enabled }}
      nodeSelector:
        {{ .Values.nodeSelectors.accelleranCBRSFramework.label }}: {{ .Values.nodeSelectors.accelleranCBRSFramework.value }}
    {{- end }}
      containers:
      - name: ric-web
        image: {{ .Values.images.tags.ricWeb }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        env:
        - name: NATS_URL
          value: {{ .Values.config.nats.url | quote }}