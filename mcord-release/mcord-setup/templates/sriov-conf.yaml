---
kind: ConfigMap
apiVersion: v1
metadata:
  name: sriov-config
  namespace: kube-system
data:
  config.json: |
    {
      "resourceList":
      [
        {
          "resourceName": {{ .Values.sriov.name | quote }},
          "rootDevices": [{{ .Values.sriov.devicepci | quote }}],
          "sriovMode": true,
          "deviceType": "vfio"
        }
      ]
    }
