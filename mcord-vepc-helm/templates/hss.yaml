---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Name }}
  name: hss
spec:
  selector:
    app: hss
  clusterIP: None
  ports:
  - name: s6a
    port: {{ .Values.hss.ports.s6a }}
    protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ .Release.Name }}
  name: hss
  labels:
    app: hss
spec:
  replicas: {{ .Values.hss.replicas }}
  selector:
    matchLabels:
      app: hss
  serviceName: "hss"
  template:
    metadata:
      namespace: {{ .Release.Name }}
      labels:
        app: hss
    spec:
      terminationGracePeriodSeconds: 1
      initContainers:
      - name: init-db
        image: {{ .Values.hss.images.init }}
        command: [ "bash", "-xc"]
        args:
        - until nslookup cassandra; do echo waiting for cassandra; sleep 2; done;
          cqlsh --file /scripts/oai_db.cql cassandra;
          /scripts/data_provisioning_users.sh 302720100000421 1122334456 apn1 6226194254742F2D67145153602F7C8D 1 cassandra mme-0.mme.{{ .Release.Name }}.svc.cluster.local mme.{{ .Release.Name }}.svc.cluster.local;
          cqlsh -e "use vhss; update users_imsi set opc='D6CAF10C337FD65AC31A18EBACBF5BF9' where imsi='302720100000421';" cassandra;
          cqlsh -e "select imsi,key,opc,sqn from vhss.users_imsi;" cassandra;
          /scripts/data_provisioning_mme.sh 1 19136246000 mme-0.mme.{{ .Release.Name }}.svc.cluster.local mme.{{ .Release.Name }}.svc.cluster.local 1 cassandra;
          /scripts/data_provisioning_mme.sh 1 19136246000 smsrouter.test3gpp.net test3gpp.net 0  cassandra;
      containers:
      - name: hss
        image: {{ .Values.hss.images.hss }}
        imagePullPolicy: Always
        env:
          - name: CASSANDRA_ADDR
            value: cassandra
          - name: MME_ADDR
            value: mme-0.mme.{{ .Release.Name }}.svc.cluster.local
        #command: [ "sleep", "3600"]
        resources:
          limits:
            cpu: {{ .Values.hss.resources.cpu }}
            memory: {{ .Values.hss.resources.mem }}
        volumeMounts:
        - name: hss-script
          mountPath: /opt/c3po/hss/launch.sh
          subPath: launch.sh
        - name: hss-config
          mountPath: /etc/hss/conf
      volumes:
      - name: hss-script
        configMap:
          name: hss
          defaultMode: 493
      - name: hss-config
        configMap:
          name: hss
          defaultMode: 420
