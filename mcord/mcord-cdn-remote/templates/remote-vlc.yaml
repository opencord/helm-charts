---
apiVersion: v1
kind: Service
metadata:
  name: remote-vlc
spec:
  selector:
    app: remote-vlc
  clusterIP: None
  ports:
  - name: vlc
    port: {{ .Values.remote_vlc.ports.vlc }}
    protocol: TCP
  - name: http
    port: {{ .Values.remote_vlc.ports.http }}
    protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: remote-vlc
  namespace: wowz
  labels:
    app: remote-vlc
spec:
  replicas: {{ .Values.remote_vlc.replicas }}
  selector:
    matchLabels:
      app: remote-vlc
  serviceName: "remote-vlc"
  template:
    metadata:
      labels:
        app: remote-vlc
    spec:
      initContainers:
      - name: init-iptables
        image: {{ .Values.remote_vlc.images.init }}
        command: [ "sh", "-c"]
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        args:
        - iptables -I OUTPUT -p icmp --icmp-type destination-unreachable -j DROP;
      terminationGracePeriodSeconds: 1
      containers:
      - name: streaming_remote
        image: {{ .Values.remote_vlc.images.remote_vlc_image }}
        imagePullPolicy: IfNotPresent
        stdin: true
        tty: true
        command: [ "bash",  "-xc"]
        args:
        - sed -i 's/geteuid/getppid/' /usr/bin/vlc;
          cvlc -I dummy larva_360p.mp4 --sout=#rtp{sdp=rtsp://0.0.0.0:{{ .Values.remote_vlc.ports.vlc }}/video} --sout-keep --loop --ttl 10 --mtu 1200;
        resources:
          limits:
            cpu: {{ .Values.remote_vlc.resources.cpu }}
            memory: {{ .Values.remote_vlc.resources.mem }}
          securityContext:
            capabilities:
              add:
              - NET_ADMIN