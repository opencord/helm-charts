---
apiVersion: v1
kind: Service
metadata:
  name: accelleran
spec:
  selector:
    app: accelleran
  clusterIP: None
  ports:
    - name: s1ap
      port: {{ .Values.accelleran.ports.s1ap }}
      protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: accelleran
  labels:
    app: accelleran
spec:
  replicas: {{ .Values.accelleran.replicas }}
  selector:
    matchLabels:
      app: accelleran
  serviceName: "accelleran"
  template:
    metadata:
      labels:
        app: accelleran
      annotations:
        k8s.v1.cni.cncf.io/networks: '[
                { "name": "bbu-net", "interface": "bbu-net", "namespace": "default" }
            ]'
    spec:
      initContainers:
      - name: init-iptables
        image: {{ .Values.accelleran.images.init }}
        command: [ "sh", "-c"]
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        args:
        - iptables -I OUTPUT -p icmp --icmp-type destination-unreachable -j DROP;
      terminationGracePeriodSeconds: 1
      containers:
      - name: nats
        image: {{ .Values.accelleran.images.nats }}
        imagePullPolicy: IfNotPresent
        stdin: true
        tty: true
        env:
        - name: NATS_SERVICE_NAME
          value: {{ .Values.accelleran.nats_service_name }}
        command: [ "sh", "-c"]
        args:
        - gnatsd -DV -c /etc/gnatsd.conf;
        resources:
          limits:
            cpu: {{ .Values.accelleran.resources.cpu }}
            memory: {{ .Values.accelleran.resources.mem }}
            intel.com/sriov: '2'
          capabilities:
            add:
            - NET_ADMIN
            - IPC_LOCK
      - name: redis
        image: {{ .Values.accelleran.images.redis }}
        imagePullPolicy: IfNotPresent
        stdin: true
        tty: true
        command: [ "sh", "-c"]
        args:
        - /usr/local/bin/redis-server;
          sleep 5;
          redis-cli -h localhost -p 6379 set NATS_SERVICE_URL "nats://{{ .Values.accelleran_hostname }}:4222";
        resources:
          limits:
            cpu: {{ .Values.accelleran.resources.cpu }}
            memory: {{ .Values.accelleran.resources.mem }}
            intel.com/sriov: '2'
          capabilities:
            add:
            - NET_ADMIN
            - IPC_LOCK
      - name: bbu
        image: {{ .Values.accelleran.images.bbu }}
        imagePullPolicy: IfNotPresent
        env:
          - name: HOST_IP
            value: {{ .Values.accelleran_hostname }}
        stdin: true
        tty: true
        commands: ["sh", "-c"]
        args:
        - sed -i '/^redis.hostname/s/:.*/:{{ .Values.redis_hostname }}/' /mnt/app/bootstrap.txt
        - sed -i '^instance.filter/s/:.*/:{{ .Values.accelleran.inst_id }}' /mnt/app/bootstrap.txt
        - /l3/l3start
        volumeMounts:
        - name: bbu-config
          mountPath: /mnt/app
        resources:
          limits:
            cpu: {{ .Values.accelleran.resources.cpu }}
            memory: {{ .Values.accelleran.resources.mem }}
            intel.com/sriov: '2'
          capabilities:
            add:
            - NET_ADMIN
            - IPC_LOCK
      volumes:
        - name: bbu-config
          configMap:
            name: l3-config