namespace: epc
nginx_hostname: "nginx"
local_vlc_hostname: "local_vlc"
# need to be changed to appropriate wowza server outside edge
remote_ip: 10.10.10.10


nginx:
  images:
    nginx_image: "10.90.0.131:30500/nginx:latest"
  ports:
    port1935: 1935
  replicas: 1

local_vlc:
  images:
    init: "ngick8stesting/c3po-mmeinit"
    local_vlc_image: "woojoong/mwc-cdn:local"
  ports:
    vlc: 9089
    http: 50002
  replicas: 1
  resources:
    cpu: 3
    mem: "1Gi"