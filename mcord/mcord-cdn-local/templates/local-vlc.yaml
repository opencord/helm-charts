---
apiVersion: v1
kind: Service
metadata:
  name: local-vlc
spec:
  selector:
    app: local-vlc
  type: NodePort
  ports:
  - name: vlc
    port: {{ .Values.local_vlc.ports.vlc }}
    targetPort: {{ .Values.local_vlc.ports.vlc }}
    nodePort: {{ .Values.local_vlc.ports.vlc_np }}
    protocol: TCP
  - name: http
    port: {{ .Values.local_vlc.ports.http }}
    targetPort: {{ .Values.local_vlc.ports.http }}
    nodePort: {{ .Values.local_vlc.ports.http_np }}
    protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: local-vlc
  labels:
    app: local-vlc
spec:
  replicas: {{ .Values.local_vlc.replicas }}
  selector:
    matchLabels:
      app: local-vlc
  serviceName: "local-vlc"
  template:
    metadata:
      labels:
        app: local-vlc
    spec:
      #hostNetwork: true
      terminationGracePeriodSeconds: 1
      containers:
      - name: streaming
        image: {{ .Values.local_vlc.images.local_vlc_image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.local_vlc.ports.vlc }}
        - containerPort: {{ .Values.local_vlc.ports.http }}
        stdin: true
        tty: true
        command: [ "bash",  "-xc"]
        args:
        - sed -i 's/geteuid/getppid/' /usr/bin/vlc;
          cvlc bunny_720p.mp4 --sout "#transcode{vcodec=h264,acodec=mpga,ab=128,channels=2,samplerate=44100}:std{dst=0.0.0.0:9089,mux=ts,sap,name=Test,access=http}" --sout-keep --loop --ttl 10 --mtu 1200;
          #cvlc bunny_360p.mp4 --sout "#transcode{vcodec=h264,acodec=mpga,ab=128,channels=2,samplerate=44100}:rtp{dst=0.0.0.0,port={{ .Values.local_vlc.ports.vlc }},mux=ts,sap,name=Test}" --sout-keep --loop --ttl 10 --mtu 1200;
        resources:
          limits:
            cpu: {{ .Values.local_vlc.resources.cpu }}
            memory: {{ .Values.local_vlc.resources.mem }}