---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: s1u-net
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/sriov
spec:
  config: '{
    "type": "sriov",
    "name": "s1u-net",
    "ipam": {
        "type": "host-local",
        "subnet": "119.0.0.0/24",
        "routes": [
            { "dst": "0.0.0.0/0" }
        ]
    }
}'
