apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bbsim
  namespace: {{ .Values.namespace }}
  labels:
    app: bbsim
    chart: {{ template "bbsim.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app: bbsim
      release: {{ .Release.Name }}
  serviceName: bbsim
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        app: bbsim
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.global.registry }}{{ .Values.image.repository }}:{{ tpl .Values.image.tag . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          command: [
            "/app/bbsim",
            "-n", "{{ .Values.onus_per_pon_port }}",
            "-m", "{{ .Values.emulation_mode }}",
            "-H", ":50060",
            "-id", "{{ .Values.olt_id }}",
            "-i", "{{ .Values.pon_ports }}",
            "-aw", "{{ .Values.wpa_wait }}",
            "-dw", "{{ .Values.dhcp_wait }}",
            "-k", "{{ .Values.kafka_broker }}",
          ]
          ports:
            - name: "bbsim-olt-id-{{ .Values.olt_id }}"
              containerPort: 50060
              port: 50060
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
{{ toYaml .Values.resources | indent 12 }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
