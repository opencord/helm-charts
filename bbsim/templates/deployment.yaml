apiVersion: extensions/v1beta2
kind: Deployment
metadata:
  name: {{ template "bbsim.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ template "bbsim.name" . }}
    chart: {{ template "bbsim.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "bbsim.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "bbsim.name" . }}
        release: {{ .Release.Name }}
    spec:
      serviceAccount: {{ .Values.serviceAccountName }}
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.global.registry }}{{ .Values.image.repository }}:{{ tpl .Values.image.tag . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/bbsim",
                    "-H", "127.0.0.1:{{ .Values.start_tcp_port }}",
                    "-N", {{ .Values.olts }},
                    "-i", {{ .Values.pon_ports }},
                    "-n", {{ .Values.onus_per_pon_port }},
                    ]
          ports:
          {{- $startport := int .Values.start_tcp_port -}}
          {{- range $i, $t := until (int .Values.olts) }}
            - name: "bbsim-olt-{{ $i }}"
              containerPort: {{ add $i $startport }}
              protocol: TCP
          {{- end }}
          env:
{{ toYaml .Values.env | indent 12 }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
