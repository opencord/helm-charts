apiVersion: v1
kind: Service
metadata:
  name: {{ template "bbsim.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ template "bbsim.name" . }}
    chart: {{ template "bbsim.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
{{- $startport := int .Values.start_tcp_port -}}
{{- range $i, $t := until (int .Values.olts) }}
    - name: "bbsim-olt-{{ $i }}"
      port: {{ add $i $startport }}
      protocol: TCP
{{- end }}
  selector:
    app: {{ template "bbsim.name" . }}
    release: {{ .Release.Name }}
