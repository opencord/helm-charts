# bbsim values

olts: 1
pon_ports: 2
onus_per_pon_port: 4

start_tcp_port: 50060

image:
  repository: 'voltha/voltha-bbsim'
  tag: '{{ .Chart.AppVersion }}'
  pullPolicy: 'IfNotPresent'

global:
  registry: ''

namespace: default
serviceAccountName: default

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
