node_selectors:
  enabled: false
  video-archive:
    label: video-archive
    value: enabled
  antmedia:
    label: antmedia
    value: enabled

images:
  tags:
    video_archive: docker.io/omecproject/cdn-video-repo:1.0.0
    antmedia: docker.io/omecproject/cdn-antmedia:1.0.0
    dep_check: quay.io/stackanetes/kubernetes-entrypoint:v0.3.1
  pull_policy: IfNotPresent

resources:
  enabled: true
  video_archive:
    requests:
      cpu: 3
      memory: 1Gi
    limits:
      cpu: 3
      memory: 1Gi
  antmedia:
    requests:
      cpu: 3
      memory: 1Gi
    limits:
      cpu: 3
      memory: 1Gi

video_archive:
  images:
    video_archive_image: "docker.io/omecproject/cdn-video-repo:1.0.0"
  ports:
    vlc: 8089
    http: 50001
    node_ports:
      enabled: true
      vlc: 31889
      http: 31501
  replicas: 1

antmedia:
  ip: 10.90.0.132
  images:
    antmedia_image: "docker.io/omecproject/cdn-antmedia:1.0.0"
  ports:
    httpui: 5080
    rtmp: 1935
    node_ports:
      enabled: true
      httpui: 32080
      rtmp: 30935
  replicas: 1
