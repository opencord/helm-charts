---
apiVersion: v1
kind: Service
metadata:
  name: antmedia
  labels:
{{ tuple "antmedia" . | include "cdn-remote.metadata_labels" | indent 4 }}
spec:
  selector:
{{ tuple "antmedia" . | include "cdn-remote.metadata_labels" | indent 4 }}
{{- if .Values.remote_streaming.ports.node_ports.enabled }}
  type: NodePort
{{- end }}
  ports:
  - name: httpui
    port: {{ .Values.antmedia.ports.httpui }}
    protocol: TCP
{{- if .Values.remote_streaming.ports.node_ports.enabled }}
    nodePort: {{ .Values.antmedia.ports.node_ports.httpui }}
{{- end }}
  - name: rtmp
    port: {{ .Values.antmedia.ports.rtmp }}
    protocol: TCP
{{- if .Values.remote_streaming.ports.node_ports.enabled }}
    nodePort: {{ .Values.antmedia.ports.node_ports.rtmp }}
{{- end }}
