{{ tuple "video-archive" . | include "cdn-remote.service_account" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: video-archive
  labels:
{{ tuple "video-archive" . | include "cdn-remote.metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.remote_streaming.replicas }}
  selector:
    matchLabels:
{{ tuple "video-archive" . | include "cdn-remote.metadata_labels" | indent 6 }}
  serviceName: "video-archive"
  template:
    metadata:
      labels:
{{ tuple "video-archive" . | include "cdn-remote.metadata_labels" | indent 8 }}
    spec:
    {{- if .Values.node_selectors.enabled }}
      nodeSelector:
        {{ .Values.node_selectors.remote_streaming.label }}: {{ .Values.node_selectors.remote_streaming.value }}
    {{- end }}
      serviceAccountName: video-archive
      containers:
      - name: streaming
        image: {{ .Values.images.tags.remote_streaming | quote }}
        imagePullPolicy: {{ .Values.images.pull_policy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsUser: 0
        ports:
        - containerPort: {{ .Values.remote_streaming.ports.vlc }}
        - containerPort: {{ .Values.remote_streaming.ports.http }}
        stdin: true
        tty: true
        command: [ "bash",  "-xc"]
        args:
        - sed -i 's/geteuid/getppid/' /usr/bin/vlc;
          /opt/start-stream.sh
      {{- if .Values.resources.enabled }}
        resources:
{{ toYaml .Values.resources.remote_streaming | indent 10 }}
      {{- end }}
        volumeMounts:
        - name: start-script
          mountPath: /opt/start-stream.sh
          subPath: start-stream.sh
      volumes:
      - name: start-script
        configMap:
          name: start-stream
          defaultMode: 493