# Default values for progran.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

imagePullPolicy: 'IfNotPresent'

synchronizerImage: "xosproject/progran-synchronizer:master"

xosAdminUser: "admin@opencord.org"
xosAdminPassword: "letmein"

# TOSCA to create the Service model in XOS
serviceTosca:
  tosca_definitions_version: tosca_simple_yaml_1_0

  imports:
    - custom_types/progranservice.yaml

  description: Configures the progran service

  topology_template:
    node_templates:

      service#progran:
        type: tosca.nodes.ProgranService
        properties:
          name: progran

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
