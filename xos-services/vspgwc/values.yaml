# Default values for vspgwc.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

imagePullPolicy: 'IfNotPresent'

synchronizerImage: "xosproject/vspgwc-synchronizer:master"

xosAdminUser: "admin@opencord.org"
xosAdminPassword: "letmein"

# TOSCA to create the Service model in XOS
serviceTosca:
  tosca_definitions_version: tosca_simple_yaml_1_0

  imports:
    - custom_types/vspgwcservice.yaml
    - custom_types/vspgwcvendor.yaml
    - custom_types/flavor.yaml
    - custom_types/image.yaml

  description: Configures the vSPGWC service

  topology_template:
    node_templates:

      service#vspgwc:
        type: tosca.nodes.VSPGWCService
        properties:
          name: vspgwc

      intel_vspgwc:
        type: tosca.nodes.VSPGWCVendor
        properties:
          name: intel_vspgwc
        requirements:
          - image:
              node: image-spgwc
              relationship: tosca.relationships.BelongsToOne
          - flavor:
              node: m1.large
              relationship: tosca.relationships.BelongsToOne

      image-spgwc:
        type: tosca.nodes.Image
        properties:
          name: image-spgwc
          disk_format: QCOW2
          container_format: BARE
          path: http://www.vicci.org/cord/ngic-cp1-comp.qcow2.20180118

      m1.large:
        type: tosca.nodes.Flavor
        properties:
          name: m1.large

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
