# Default values for internetemulator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

imagePullPolicy: 'IfNotPresent'

synchronizerImage: "xosproject/internetemulator-synchronizer:master"

xosAdminUser: "admin@opencord.org"
xosAdminPassword: "letmein"

# TOSCA to create the Service model in XOS
serviceTosca:
  tosca_definitions_version: tosca_simple_yaml_1_0

  imports:
    - custom_types/internetemulatorservice.yaml
    - custom_types/image.yaml

  description: Configures the internetemulator service

  topology_template:
    node_templates:

      service#internetemulator:
        type: tosca.nodes.InternetEmulatorService
        properties:
          name: internetemulator

      image-internetemulator:
        type: tosca.nodes.Image
        properties:
          name: image-internetemulator
          disk_format: QCOW2
          container_format: BARE
          path: http://www.vicci.org/cord/vlc-compress.qcow2.20180119

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
